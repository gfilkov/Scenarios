<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raster fetch · canvas painter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f4f6fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            padding: 28px 32px;
            max-width: 760px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            font-weight: 500;
            font-size: 1.8rem;
            color: #1e293b;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2 span {
            background: #e9eef6;
            border-radius: 40px;
            font-size: 0.9rem;
            padding: 4px 14px;
            color: #2c3e5c;
            font-weight: 400;
        }
        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 28px;
        }
        .input-group input {
            flex: 1 1 260px;
            padding: 14px 18px;
            font-size: 1.1rem;
            border: 2px solid #dbe2ed;
            border-radius: 60px;
            outline: none;
            transition: 0.15s;
            background: #fbfdff;
			
			font-family: inherit;
			resize: vertical;
			min-height: 4.5em;
			line-height: 1.35;
        }
        .input-group input:focus {
            border-color: #6b8cff;
            box-shadow: 0 0 0 4px rgba(107, 140, 255, 0.15);
        }
		.input-group select {
			padding: 14px 18px;
			font-size: 1.1rem;
			border: 2px solid #dbe2ed;
			border-radius: 60px;
			outline: none;
			transition: 0.15s;
			background: #fbfdff;
			font-family: inherit;
		}
        .input-group button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 500;
            background: #1e2f4e;
            border: none;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 30, 70, 0.2);
        }
        .input-group button:hover {
            background: #142136;
            transform: scale(1.01);
        }
        .input-group button:active {
            transform: scale(0.98);
        }
        .canvas-wrapper {
            background: #ffffff;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #e2e8f2;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            margin-top: 10px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #f2f5fa;
            border: 1px dashed #b9c8e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: 0.1s;
        }
        .status {
            font-size: 0.9rem;
            color: #546a8a;
            margin-top: 12px;
            min-height: 1.6rem;
            padding-left: 6px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status.error {
            color: #b91c1c;
        }
        .note {
            font-size: 0.85rem;
            color: #667c9a;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid #eef2f8;
        }
        code {
            background: #eef2f8;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #1a2b4c;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>
        ✦ raster fetch
        <span>canvas demo</span>
    </h2>

    <!-- input + submit -->
	<div class="input-group">
	    <select id="apiSelect" aria-label="API function">
			<option value="raster" selected>Raster</option>
			<option value="textToCoords">TextToCoords</option>
			<option value="textToCoords">LED (new)</option>
		</select>
		
		<select id="alignSelect" aria-label="Alignment">
			<option value="left">Left</option>
			<option value="center" selected>Center</option>
			<option value="right">Right</option>
		</select>
		
		<textarea id="wordInput" rows="4" cols="50" placeholder="e.g. hello, world, 123" autofocus>hello</textarea>
		<button id="submitBtn">Submit</button>
	</div>
	
    <!-- canvas -->
    <div class="canvas-wrapper">
        <canvas id="outputCanvas" width="700" height="240"></canvas>
    </div>

    <!-- status & info -->
    <div id="statusMessage" class="status">⚡ ready — type a word and press submit</div>
    <div id="note"> class="note">
        ⚙️ fetch → <code>${baseUrl}raster?text=word</code> &nbsp;|&nbsp; paints binary response on canvas
    </div>
</div>

<script src="js/mow-func-api.js"></script>
</body>
</html>
